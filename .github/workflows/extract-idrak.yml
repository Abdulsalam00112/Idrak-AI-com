name: Extract Idrak Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Idrak project
        run: |
          rm -rf components src public db lib app package.json package-lock.json pnpm-lock.yaml yarn.lock next.config.* tsconfig.json
          unzip -o idrak-ai-fixes-v7.zip -d extracted
          cp -a extracted/idrak/. .
          rm -rf extracted
          rm -f idrak-ai-fixes-v7.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Idrak AI source code" || echo "No changes to commit"
          git push
